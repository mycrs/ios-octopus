name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # Actions sekmesinden elle de tetiklenebilir

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1) Mimari denetimi — saniyeler sürer, en önce patlasın ──────────
  architecture:
    name: Mimari kuralları
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Demir kuralları denetle
        run: bash Scripts/check-architecture.sh

  # ── 2) Mantık testleri — Linux'ta, simülatörsüz, hızlı ─────────────
  #
  # Domain saf Swift olduğu için macOS gerektirmez. Mimarinin
  # doğrudan kazancı: iş kuralları ücretsiz ve saniyeler içinde doğrulanır.
  logic-tests:
    name: Domain testleri (Linux)
    runs-on: ubuntu-latest
    container: swift:5.9
    steps:
      - uses: actions/checkout@v5
      - name: Domain testlerini koş
        run: swift test --package-path Packages/OctopusDomain

  # ── 3) Gerçek iOS derlemesi — macOS runner ─────────────────────────
  ios-build:
    name: iOS derleme
    runs-on: macos-latest
    needs: [architecture]
    steps:
      - uses: actions/checkout@v5

      - name: Xcode sürümünü göster
        run: xcodebuild -version

      - name: XcodeGen kur
        run: brew install xcodegen

      - name: Xcode projesini üret
        run: xcodegen generate

      # Not: ayrı bir "derle" adımı yok — `xcodebuild test` zaten derliyor.
      # Ayrıca derlemek turu boşuna uzatıyordu.
      #
      # Simülatör adı Xcode sürümüne göre değişir (iPhone 15 → 16 → 17...).
      # Çalışma anında bulunur ve GITHUB_ENV üzerinden sonraki adımlara taşınır —
      # her adım ayrı bir kabukta çalıştığı için kabuk değişkeni yetmez.
      - name: Simülatör seç
        run: |
          SIM=$(xcrun simctl list devices available \
                | grep -oE '^\s+iPhone [^(]+' \
                | head -1 | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          if [ -z "$SIM" ]; then
            echo "::error::Kullanılabilir iPhone simülatörü bulunamadı"
            exit 1
          fi
          echo "Seçilen simülatör: $SIM"
          echo "SIM=$SIM" >> "$GITHUB_ENV"

      # `-derivedDataPath` sabit: ekran görüntüsü adımı aynı ürünü kullanır,
      # uygulamayı ikinci kez derlemeye gerek kalmaz.
      - name: Uygulama testleri
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme Octopus \
            -destination "platform=iOS Simulator,name=$SIM" \
            -derivedDataPath ./DerivedData \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO

      # Uygulamayı simülatörde çalıştırıp ekran görüntüsü alır.
      #
      # Geliştirme Windows'ta yapıldığı için arayüzün gerçekten çizildiğini
      # görmenin başka yolu yok: derleme ve testler geçse bile ekranın nasıl
      # göründüğünü kimse görmemiş olur. Görüntüler artifact olarak inip
      # doğrudan incelenebilir.
      - name: Uygulamayı çalıştır ve ekran görüntüsü al
        run: |
          set -o pipefail
          mkdir -p screenshots

          xcrun simctl boot "$SIM" 2>/dev/null || true
          xcrun simctl bootstatus "$SIM" -b

          # Derleme YOK: test adımı aynı derived data yoluna zaten üretti.
          APP_PATH=$(find ./DerivedData/Build/Products -name "Octopus.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::Derlenmiş uygulama bulunamadı"
            exit 1
          fi
          echo "Uygulama: $APP_PATH"

          # Ekran boyutu sorunlarının teşhisi: uygulamanın GERÇEK Info.plist'i
          # ne diyor? Kaynak plist ile derlenen plist ayrışabiliyor.
          echo "::group::Derlenmiş Info.plist — ekran ayarları"
          plutil -p "$APP_PATH/Info.plist" \
            | grep -iE "launch|fullscreen|orientation|devicefamily" \
            || echo "(ekranla ilgili anahtar bulunamadı)"
          echo "::endgroup::"

          xcrun simctl install booted "$APP_PATH"

          # 1) Kaynak eklenmemiş hâl — karşılama ekranı.
          xcrun simctl launch booted com.octopus.iptv
          sleep 8   # açılış animasyonu ve ilk çizim
          xcrun simctl io booted screenshot screenshots/01-karsilama.png

          # Tasarım denetimi için onboarding'in etkileşim gerektiren iki hâli.
          # Bu başlangıç kapıları yalnızca DEBUG derlemede bulunur.
          xcrun simctl terminate booted com.octopus.iptv 2>/dev/null || true
          xcrun simctl launch booted com.octopus.iptv \
            -startupOnboardingActivation >/dev/null
          sleep 3
          xcrun simctl io booted screenshot screenshots/01b-aktivasyon.png

          xcrun simctl terminate booted com.octopus.iptv 2>/dev/null || true
          xcrun simctl launch booted com.octopus.iptv \
            -startupOnboardingLoading >/dev/null
          sleep 3
          xcrun simctl io booted screenshot screenshots/01c-senkronizasyon.png

          # 2) İçerikli ekranlar.
          #
          # Kaynak eklenmemiş uygulamada tek görülebilen ekran karşılamaydı;
          # ana sayfa, katalog ızgarası ve kanal listesi hiç kare alınamıyordu
          # ve tasarım kör yapılıyordu. `-seedDemoData` sahte katalog yazar.
          #
          # `-startup.tab` bir NSUserDefaults anahtarıdır: iOS, `-anahtar değer`
          # biçimindeki açılış argümanlarını otomatik olarak varsayılanlara
          # yazar. Uygulamada ekstra kod gerekmiyor.
          #
          # ⚠️ Yalnızca `AppTab.startupOptions` (home/live/movies/series)
          # geçerli — arama ve ayarlar kasıtlı olarak dışarıda (bkz.
          # AppRoute.swift): "iş başlatan" ekranlar, açılışta karşılanmamalı.
          # Listede olmayan bir sekme verilirse kod sessizce home'a düşer.
          shoot() {
            xcrun simctl terminate booted com.octopus.iptv 2>/dev/null || true
            xcrun simctl launch booted com.octopus.iptv \
              -seedDemoData -startup.tab "$1" >/dev/null
            sleep 8
            xcrun simctl io booted screenshot "screenshots/$2"
          }

          shoot home   02-ana-sayfa.png

          # Ana sayfadaki bildirim yüzeyi — panel duyurusu yokken normalde
          # görünmez; görsel regresyon için DEBUG başlangıç argümanıyla açılır.
          xcrun simctl terminate booted com.octopus.iptv 2>/dev/null || true
          xcrun simctl launch booted com.octopus.iptv \
            -seedDemoData -startup.tab home -startupAnnouncement >/dev/null
          sleep 8
          xcrun simctl io booted screenshot screenshots/02b-bildirim.png

          shoot live   03-canli-tv.png
          shoot movies 04-filmler.png
          shoot series 05-diziler.png
          shoot favorites 06-favoriler.png

          # Birleşik arama — sonuç türleri dikey bölümler, içerikleri yatay raflar.
          xcrun simctl terminate booted com.octopus.iptv 2>/dev/null || true
          xcrun simctl launch booted com.octopus.iptv \
            -seedDemoData -startupSearch >/dev/null
          sleep 10
          xcrun simctl io booted screenshot screenshots/06b-arama.png

          # 2b) Oynatıcı — açılışta doğrudan açılır.
          #
          # Oynatıcıya girmek normalde bir kanala **dokunmayı** gerektirir
          # ve `simctl` dokunma üretemez; bu yüzden `-startup.player`
          # (yalnızca DEBUG) diye bir kapı var. Değer
          # `PlaybackItem.Source.storageKey` biçimindedir ve demo kaynağın
          # kimlik şeması `<playlist>#<tür>#<hamId>` olduğu için
          # ilk kanal `live:demo#live#0` olur.
          #
          # Demo kaynağın ilk kanalı Apple'ın açık HLS örneğine bakar —
          # yani bu kare oynatıcının gerçekten video çizdiğini gösterir.
          xcrun simctl terminate booted com.octopus.iptv 2>/dev/null || true
          xcrun simctl launch booted com.octopus.iptv \
            -seedDemoData -startup.player "live:demo#live#0" >/dev/null
          sleep 14   # ağdan segment indirme + ilk kare
          xcrun simctl io booted screenshot screenshots/09-oynatici.png

          # Denetim katmanı yukarıdaki karede **yok** ve bu doğru: 3,5 sn
          # sonra kendiliğinden gizleniyor. Ama yerleşimini de görmek
          # gerekiyor — ikinci kare erken alınıyor.
          #
          # ⚠️ Erken kare deterministik: gizleme yalnızca oynatma
          # gerçekten başladıysa çalışıyor (`state == .playing`), 2 sn'de
          # daha yükleniyor. Yani denetimler kesin görünür.
          xcrun simctl terminate booted com.octopus.iptv 2>/dev/null || true
          xcrun simctl launch booted com.octopus.iptv \
            -seedDemoData -startup.player "live:demo#live#0" >/dev/null
          sleep 2
          xcrun simctl io booted screenshot screenshots/10-oynatici-denetimler.png

          # VOD denetimleri — scrub bar, on saniye sarma ve seçenekler menüsü.
          # İlk demo filmi Apple'ın açık HLS VOD örneğine bakar. Denetimler
          # görsel kontrolde kalıcı olsun diye DEBUG bayrağıyla gizleme uzatılır.
          xcrun simctl terminate booted com.octopus.iptv 2>/dev/null || true
          xcrun simctl launch booted com.octopus.iptv \
            -seedDemoData -keepPlayerControls \
            -startup.player "movie:demo#vod#0" >/dev/null
          sleep 10
          xcrun simctl io booted screenshot screenshots/11-vod-denetimler.png

          # 3) Dynamic Type — büyük erişilebilirlik yazı boyutu.
          #
          # Kod tabanında bunu ele alan neredeyse hiçbir şey yok
          # (`minimumScaleFactor` tek bir yerde). Tahmin etmek yerine
          # gerçek bir kareyle ölçülüyor: metin yoğun iki ekran
          # (kanal satırı + hero kartı) en büyük boyutta nasıl davranıyor?
          xcrun simctl ui booted content_size accessibility-extra-extra-extra-large
          shoot home 07-buyuk-yazi-ana-sayfa.png
          shoot live 08-buyuk-yazi-canli-tv.png
          xcrun simctl ui booted content_size large

          # Not: açık tema karesi alınmıyor — uygulama şu an
          # .preferredColorScheme(.dark) ile koyu temayı zorluyor.
          # Faz 3'te ThemeController gelince tema kareleri anlamlı olacak.

          ls -la screenshots

      - name: Ekran görüntülerini yükle
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ekran-goruntuleri
          path: screenshots/
          retention-days: 30
          if-no-files-found: warn

      # Derleme patlarsa günlükleri indirip inceleyebilmek için.
      - name: Hata günlüklerini yükle
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: xcodebuild-logs
          path: |
            ~/Library/Logs/DiagnosticReports
            **/*.xcresult
          retention-days: 5
          if-no-files-found: ignore

  # ── 4) Paket testleri — PARALEL ────────────────────────────────────
  #
  # Paket test hedefleri ana şemaya dahil DEĞİLDİR; `xcodebuild test
  # -scheme Octopus` onları koşmaz. Her paket ayrıca test edilir —
  # aksi halde yazılmış ama hiç çalışmayan testler birikir.
  #
  # Sıralı koşturulduğunda tur başına 20-25 dakika sürüyordu; her paket
  # kendi runner'ında paralel çalışınca duvar saati üçte bire iniyor.
  # Genel depoda macOS runner ücretsiz olduğu için ek maliyet yok.
  #
  # OctopusDomain burada yok: saf Swift olduğu için Linux işinde koşuyor.
  package-tests:
    name: ${{ matrix.package }} testleri
    runs-on: macos-latest
    needs: [architecture]
    strategy:
      # Bir paket düşse bile diğerlerinin sonucu görülsün.
      fail-fast: false
      matrix:
        package: [OctopusData, OctopusPlayback, OctopusFeatures]
    steps:
      - uses: actions/checkout@v5

      - name: Simülatör seç
        run: |
          SIM=$(xcrun simctl list devices available \
                | grep -oE '^\s+iPhone [^(]+' \
                | head -1 | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          if [ -z "$SIM" ]; then
            echo "::error::Kullanılabilir iPhone simülatörü bulunamadı"
            exit 1
          fi
          echo "SIM=$SIM" >> "$GITHUB_ENV"

      - name: Testleri koş
        working-directory: Packages/${{ matrix.package }}
        run: |
          set -o pipefail

          # Şema adı paketin ürün sayısına göre değişir: tek ürünlü pakette
          # paket adıyla aynı, çok ürünlü pakette (OctopusFeatures) yalnızca
          # "<Ad>-Package" toplu şeması tüm hedefleri — dolayısıyla
          # testleri — içerir.
          PKG="${{ matrix.package }}"
          if xcodebuild -list 2>/dev/null | grep -qE "^ *${PKG}-Package *$"; then
            SCHEME="${PKG}-Package"
          else
            SCHEME="$PKG"
          fi
          echo "Şema: $SCHEME"

          xcodebuild test \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,name=$SIM" \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO
