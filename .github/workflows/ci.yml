name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # Actions sekmesinden elle de tetiklenebilir

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1) Mimari denetimi — saniyeler sürer, en önce patlasın ──────────
  architecture:
    name: Mimari kuralları
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Demir kuralları denetle
        run: bash Scripts/check-architecture.sh

  # ── 2) Mantık testleri — Linux'ta, simülatörsüz, hızlı ─────────────
  #
  # Domain saf Swift olduğu için macOS gerektirmez. Mimarinin
  # doğrudan kazancı: iş kuralları ücretsiz ve saniyeler içinde doğrulanır.
  logic-tests:
    name: Domain testleri (Linux)
    runs-on: ubuntu-latest
    container: swift:5.9
    steps:
      - uses: actions/checkout@v4
      - name: Domain testlerini koş
        run: swift test --package-path Packages/OctopusDomain

  # ── 3) Gerçek iOS derlemesi — macOS runner ─────────────────────────
  ios-build:
    name: iOS derleme
    runs-on: macos-latest
    needs: [architecture]
    steps:
      - uses: actions/checkout@v4

      - name: Xcode sürümünü göster
        run: xcodebuild -version

      - name: XcodeGen kur
        run: brew install xcodegen

      - name: Xcode projesini üret
        run: xcodegen generate

      # Cihaz adı yerine 'generic' hedef: simülatör isimleri Xcode
      # sürümüne göre değiştiği için bu form kırılmaz.
      - name: Derle
        run: |
          set -o pipefail
          xcodebuild build \
            -scheme Octopus \
            -destination 'generic/platform=iOS Simulator' \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO

      # Simülatör adı Xcode sürümüne göre değişir (iPhone 15 → 16 → 17...).
      # Çalışma anında bulunur ve GITHUB_ENV üzerinden sonraki adımlara taşınır —
      # her adım ayrı bir kabukta çalıştığı için kabuk değişkeni yetmez.
      - name: Simülatör seç
        run: |
          SIM=$(xcrun simctl list devices available \
                | grep -oE '^\s+iPhone [^(]+' \
                | head -1 | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          if [ -z "$SIM" ]; then
            echo "::error::Kullanılabilir iPhone simülatörü bulunamadı"
            exit 1
          fi
          echo "Seçilen simülatör: $SIM"
          echo "SIM=$SIM" >> "$GITHUB_ENV"

      - name: Uygulama testleri
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme Octopus \
            -destination "platform=iOS Simulator,name=$SIM" \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO

      # Paket test hedefleri ana şemaya dahil DEĞİLDİR; `xcodebuild test -scheme
      # Octopus` onları koşmaz. Her paket kendi dizininde ayrıca test edilir —
      # aksi halde yazılmış ama hiç çalışmayan testler birikir.
      #
      # OctopusDomain burada yok: saf Swift olduğu için Linux işinde koşuyor.
      # Bunlar UIKit/SwiftUI/Security'ye bağlı olduğundan simülatör gerekiyor.
      - name: Paket testleri (simülatör)
        run: |
          set -o pipefail
          for pkg in OctopusData OctopusPlayback OctopusFeatures; do
            echo "::group::$pkg testleri"
            (
              cd "Packages/$pkg"

              # Şema adı paketin ürün sayısına göre değişir:
              # tek ürünlü pakette paket adıyla aynı, çok ürünlü pakette
              # (OctopusFeatures) yalnızca "<Ad>-Package" toplu şeması
              # tüm hedefleri — dolayısıyla testleri — içerir.
              if xcodebuild -list 2>/dev/null | grep -qE "^ *${pkg}-Package *$"; then
                SCHEME="${pkg}-Package"
              else
                SCHEME="$pkg"
              fi
              echo "Şema: $SCHEME"

              xcodebuild test \
                -scheme "$SCHEME" \
                -destination "platform=iOS Simulator,name=$SIM" \
                -skipMacroValidation \
                CODE_SIGNING_ALLOWED=NO
            ) || { echo "::error::$pkg testleri başarısız"; exit 1; }
            echo "::endgroup::"
          done

      # Derleme patlarsa günlükleri indirip inceleyebilmek için.
      - name: Hata günlüklerini yükle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: |
            ~/Library/Logs/DiagnosticReports
            **/*.xcresult
          retention-days: 5
          if-no-files-found: ignore
