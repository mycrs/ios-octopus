name: App Store Release

on:
  workflow_dispatch:
    inputs:
      distribution:
        description: Paket hedefi
        type: choice
        options: [testflight, device, none]
        default: testflight
      screenshot_operation:
        description: Apple ekran API işlemi (none normal paket akışını korur)
        type: choice
        options: [none, inspect, upload]
        default: none
      screenshot_source_run:
        description: Release-review-journey kaynağının Actions run ID değeri
        type: string
        default: ''
      screenshot_source_sha:
        description: Kaynak çalışmanın tam 40 karakter commit SHA değeri
        type: string
        default: ''
      screenshot_manifest:
        description: Yalnız upload için gözle incelenmiş özgün PNG seçim manifesti (JSON)
        type: string
        default: ''
      review_operation:
        description: target-inspect salt okunur keşif; inspect/prepare başarılı imzalı kaynak ister; paket none olmalı; göndermez
        type: choice
        options: [none, target-inspect, inspect, prepare]
        default: none
      review_source_run:
        description: Kaynak Actions run ID; target-inspect erken okuyabilir, inspect/prepare başarılı imzalı kaynak ister
        type: string
        default: ''
      review_source_sha:
        description: Yalnız inceleme hazırlığı için kaynak çalışmanın tam 40 karakter commit SHA değeri
        type: string
        default: ''
      review_expected_notes_sha256:
        description: Yalnız inspect/prepare için incelenmiş notların SHA-256 değeri; target-inspect için boş bırakın
        type: string
        default: ''

permissions:
  contents: read

jobs:
  validate-modes:
    name: İşlem modlarını doğrula
    runs-on: ubuntu-latest
    steps:
      - name: Çakışan işlemleri anahtar erişiminden önce durdur
        env:
          DISTRIBUTION: ${{ inputs.distribution }}
          SCREENSHOT_OPERATION: ${{ inputs.screenshot_operation }}
          REVIEW_OPERATION: ${{ inputs.review_operation }}
          REVIEW_SOURCE_RUN: ${{ inputs.review_source_run }}
          REVIEW_SOURCE_SHA: ${{ inputs.review_source_sha }}
          REVIEW_EXPECTED_NOTES_SHA256: ${{ inputs.review_expected_notes_sha256 }}
        run: |
          python3 - <<'PY'
          import os, re
          distribution = os.environ.get('DISTRIBUTION') or 'testflight'
          screenshots = os.environ.get('SCREENSHOT_OPERATION') or 'none'
          review = os.environ.get('REVIEW_OPERATION') or 'none'
          if distribution not in ('testflight', 'device', 'none') or screenshots not in ('none', 'inspect', 'upload') or review not in ('none', 'target-inspect', 'inspect', 'prepare'):
              raise SystemExit('Unsupported operation mode')
          if review != 'none':
              if distribution != 'none' or screenshots != 'none':
                  raise SystemExit('Review preparation requires distribution=none and screenshot_operation=none')
              if not re.fullmatch(r'[1-9][0-9]{0,19}', os.environ.get('REVIEW_SOURCE_RUN', '')) or not re.fullmatch(r'[a-f0-9]{40}', os.environ.get('REVIEW_SOURCE_SHA', '')):
                  raise SystemExit('Review inspection/preparation requires the source run and full SHA')
              notes_hash = os.environ.get('REVIEW_EXPECTED_NOTES_SHA256', '')
              if review == 'target-inspect':
                  if notes_hash:
                      raise SystemExit('Read-only target inspection does not accept notes input')
              elif not re.fullmatch(r'[a-f0-9]{64}', notes_hash):
                  raise SystemExit('Strict review preparation requires the reviewed notes hash')
          elif distribution == 'none' and screenshots == 'none':
              raise SystemExit('No package or API operation selected')
          print('Operation modes validated; no credentials accessed')
          PY

  verify:
    name: Yayın öncesi derleme ve testler
    if: (inputs.screenshot_operation == '' || inputs.screenshot_operation == 'none') && (inputs.review_operation == '' || inputs.review_operation == 'none')
    needs: [validate-modes]
    uses: ./.github/workflows/ci.yml

  upload:
    name: İmzalı test paketi
    if: (inputs.screenshot_operation == '' || inputs.screenshot_operation == 'none') && (inputs.review_operation == '' || inputs.review_operation == 'none')
    runs-on: macos-latest
    environment: app-store
    needs: [verify]
    env:
      DEVICE_SIGNING_ENABLED: ${{ secrets.OCTOPUS_TEST_DEVICE_UDID != '' && secrets.OCTOPUS_TEST_PACKAGE_PUBLIC_KEY != '' }}
    steps:
      - uses: actions/checkout@v5

      - name: XcodeGen'i kur
        run: brew install xcodegen

      - name: App Store Connect API anahtarını hazırla
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          test -n "$API_KEY_ID" && test -n "$API_ISSUER_ID" && test -n "$API_PRIVATE_KEY"
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$API_PRIVATE_KEY" > "$HOME/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8"

      - name: USB cihazı için imzalamayı hazırla
        if: inputs.distribution == 'device' || env.DEVICE_SIGNING_ENABLED == 'true'
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          OCTOPUS_TEST_DEVICE_UDID: ${{ secrets.OCTOPUS_TEST_DEVICE_UDID }}
        run: |
          python3 -m venv "$RUNNER_TEMP/device-build-tools"
          "$RUNNER_TEMP/device-build-tools/bin/python" -m pip install -r Scripts/device-build-requirements.txt
          "$RUNNER_TEMP/device-build-tools/bin/python" -m unittest discover -s Scripts -p test_device_build.py
          "$RUNNER_TEMP/device-build-tools/bin/python" Scripts/prepare-device-build.py \
            "$HOME/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8" \
            "$RUNNER_TEMP/DeviceExportOptions.plist"

      - name: Projeyi üret ve arşivle
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcodegen generate
          xcodebuild archive \
            -project Octopus.xcodeproj \
            -scheme Octopus \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Octopus.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8" \
            -authenticationKeyID "$API_KEY_ID" \
            -authenticationKeyIssuerID "$API_ISSUER_ID"

      - name: IPA üret
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          DISTRIBUTION: ${{ inputs.distribution }}
        run: |
          task_export_options=ExportOptions.plist
          if [ "$DISTRIBUTION" = device ]; then
            task_export_options="$RUNNER_TEMP/DeviceExportOptions.plist"
          fi
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Octopus.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$task_export_options" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8" \
            -authenticationKeyID "$API_KEY_ID" \
            -authenticationKeyIssuerID "$API_ISSUER_ID"

      - name: Aynı arşivden USB test paketi üret
        if: inputs.distribution != 'device' && env.DEVICE_SIGNING_ENABLED == 'true'
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Octopus.xcarchive" \
            -exportPath "$RUNNER_TEMP/device-export" \
            -exportOptionsPlist "$RUNNER_TEMP/DeviceExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8" \
            -authenticationKeyID "$API_KEY_ID" \
            -authenticationKeyIssuerID "$API_ISSUER_ID"

      - name: IPA'yı TestFlight'a yükle
        if: inputs.distribution != 'device'
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcrun altool --upload-app \
            -f "$RUNNER_TEMP/export/Octopus.ipa" \
            -t ios \
            --apiKey "$API_KEY_ID" \
            --apiIssuer "$API_ISSUER_ID"

      - name: IPA'yı sakla
        if: always() && inputs.distribution != 'device'
        uses: actions/upload-artifact@v5
        with:
          name: Octopus-ipa
          path: ${{ runner.temp }}/export/Octopus.ipa
          retention-days: 14
          if-no-files-found: warn

      - name: Cihaz paketini doğrula ve şifrele
        if: inputs.distribution == 'device' || env.DEVICE_SIGNING_ENABLED == 'true'
        env:
          DISTRIBUTION: ${{ inputs.distribution }}
          OCTOPUS_TEST_DEVICE_UDID: ${{ secrets.OCTOPUS_TEST_DEVICE_UDID }}
          OCTOPUS_TEST_PACKAGE_PUBLIC_KEY: ${{ secrets.OCTOPUS_TEST_PACKAGE_PUBLIC_KEY }}
        run: |
          export EXPECTED_BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$RUNNER_TEMP/Octopus.xcarchive/Products/Applications/Octopus.app/Info.plist")
          task_device_ipa="$RUNNER_TEMP/export/Octopus.ipa"
          if [ "$DISTRIBUTION" != device ]; then
            task_device_ipa="$RUNNER_TEMP/device-export/Octopus.ipa"
          fi
          "$RUNNER_TEMP/device-build-tools/bin/python" Scripts/seal-device-build.py \
            "$task_device_ipa" "$RUNNER_TEMP/Octopus-device.ipa.sealed"

      - name: Şifreli cihaz paketini sakla
        if: inputs.distribution == 'device' || env.DEVICE_SIGNING_ENABLED == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: Octopus-device-encrypted
          path: |
            ${{ runner.temp }}/Octopus-device.ipa.sealed
            ${{ runner.temp }}/Octopus-device.ipa.sealed.json
          retention-days: 1
          if-no-files-found: error

  screenshots:
    name: Apple ekran görüntüleri API
    if: inputs.screenshot_operation == 'inspect' || inputs.screenshot_operation == 'upload'
    needs: [validate-modes]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: app-store
    permissions:
      contents: read
      actions: read
    concurrency:
      group: octopus-app-store-screenshots-en-US
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - name: API aracını yerel sahte yanıtlarla doğrula
        run: |
          python3 -m venv "$RUNNER_TEMP/screenshot-api-tools"
          "$RUNNER_TEMP/screenshot-api-tools/bin/python" -m pip install -r Scripts/device-build-requirements.txt
          "$RUNNER_TEMP/screenshot-api-tools/bin/python" -m unittest discover -s Scripts -p test_upload_app_store_screenshots.py

      - name: Kaynak ve Apple görsel kitaplığını incele veya doğrulanmış görselleri yükle
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          SCREENSHOT_OPERATION: ${{ inputs.screenshot_operation }}
          SCREENSHOT_SOURCE_RUN: ${{ inputs.screenshot_source_run }}
          SCREENSHOT_SOURCE_SHA: ${{ inputs.screenshot_source_sha }}
          SCREENSHOT_MANIFEST_JSON: ${{ inputs.screenshot_manifest }}
        run: |
          test -n "$API_KEY_ID" && test -n "$API_ISSUER_ID" && test -n "$API_PRIVATE_KEY"
          test -n "$SCREENSHOT_SOURCE_RUN" && test -n "$SCREENSHOT_SOURCE_SHA"
          task_key_path="$RUNNER_TEMP/screenshot-AuthKey.p8"
          trap 'rm -f "$task_key_path"' EXIT
          umask 077
          printf '%s' "$API_PRIVATE_KEY" > "$task_key_path"
          unset API_PRIVATE_KEY
          "$RUNNER_TEMP/screenshot-api-tools/bin/python" Scripts/upload-app-store-screenshots.py \
            --mode "$SCREENSHOT_OPERATION" \
            --source-run "$SCREENSHOT_SOURCE_RUN" \
            --source-sha "$SCREENSHOT_SOURCE_SHA" \
            --key-path "$task_key_path" \
            --report "$RUNNER_TEMP/screenshot-api-report.json"

      - name: Gizli bilgi içermeyen API durum raporunu sakla
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: App-Store-screenshot-API-report
          path: ${{ runner.temp }}/screenshot-api-report.json
          retention-days: 7
          if-no-files-found: warn

  review-target-inspection:
    name: Apple inceleme hedefi — salt okunur
    if: inputs.review_operation == 'target-inspect'
    needs: [validate-modes]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: app-store
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5

      - name: Salt okunur hedef aracının işlem ve gizlilik sınırlarını doğrula
        run: |
          python3 -m venv "$RUNNER_TEMP/review-target-tools"
          "$RUNNER_TEMP/review-target-tools/bin/python" -m pip install -r Scripts/device-build-requirements.txt
          "$RUNNER_TEMP/review-target-tools/bin/python" -m unittest discover -s Scripts -p test_inspect_app_review_target.py

      - name: Apple anahtarına erişmeden exact kaynak kimliğini doğrula
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REVIEW_SOURCE_RUN: ${{ inputs.review_source_run }}
          REVIEW_SOURCE_SHA: ${{ inputs.review_source_sha }}
        run: |
          "$RUNNER_TEMP/review-target-tools/bin/python" Scripts/inspect-app-review-target.py \
            --source-only \
            --source-run "$REVIEW_SOURCE_RUN" \
            --source-sha "$REVIEW_SOURCE_SHA" \
            --report "$RUNNER_TEMP/app-review-target-inspection.json"

      - name: Sabit Apple inceleme hedefini yalnız GET ile oku
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          REVIEW_SOURCE_RUN: ${{ inputs.review_source_run }}
          REVIEW_SOURCE_SHA: ${{ inputs.review_source_sha }}
        run: |
          test -n "$API_KEY_ID" && test -n "$API_ISSUER_ID" && test -n "$API_PRIVATE_KEY"
          task_key_path="$RUNNER_TEMP/review-target-AuthKey.p8"
          trap 'rm -f "$task_key_path"' EXIT
          umask 077
          printf '%s' "$API_PRIVATE_KEY" > "$task_key_path"
          unset API_PRIVATE_KEY
          "$RUNNER_TEMP/review-target-tools/bin/python" Scripts/inspect-app-review-target.py \
            --source-run "$REVIEW_SOURCE_RUN" \
            --source-sha "$REVIEW_SOURCE_SHA" \
            --key-path "$task_key_path" \
            --report "$RUNNER_TEMP/app-review-target-inspection.json"

      - name: Yalnız kimlik ve alan durumlarını içeren keşif raporunu sakla
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: App-review-target-inspection
          path: ${{ runner.temp }}/app-review-target-inspection.json
          retention-days: 7
          if-no-files-found: warn

  review-preparation:
    name: İnceleme hazırlığı (gönderim yapmaz)
    if: inputs.review_operation == 'inspect' || inputs.review_operation == 'prepare'
    needs: [validate-modes]
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/app-review-prepare.yml
    with:
      operation: ${{ inputs.review_operation }}
      source_run: ${{ inputs.review_source_run }}
      source_sha: ${{ inputs.review_source_sha }}
      expected_notes_sha256: ${{ inputs.review_expected_notes_sha256 }}
    secrets:
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
