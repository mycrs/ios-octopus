# XcodeGen proje tanımı — TEK kaynak.
# Mac'te:  brew install xcodegen && xcodegen generate && open Octopus.xcodeproj
name: Octopus

options:
  bundleIdPrefix: com.octopus
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"          # iPhone + iPad
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: targeted     # Swift 6'ya kademeli geçiş için
    CLANG_ENABLE_MODULE_VERIFIER: NO
    DEAD_CODE_STRIPPING: YES
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      SWIFT_COMPILATION_MODE: wholemodule
      VALIDATE_PRODUCT: YES

# ── Yerel modüller ────────────────────────────────────────────────
packages:
  OctopusCore:
    path: Packages/OctopusCore
  OctopusDomain:
    path: Packages/OctopusDomain
  OctopusData:
    path: Packages/OctopusData
  OctopusNavigation:
    path: Packages/OctopusNavigation
  OctopusDesignSystem:
    path: Packages/OctopusDesignSystem
  OctopusPlayback:
    path: Packages/OctopusPlayback
  OctopusPlaybackVLC:
    path: Packages/OctopusPlaybackVLC
  OctopusFeatures:
    path: Packages/OctopusFeatures

targets:
  # ── Uygulama kabuğu: İNCE KALMALI ──────────────────────────────
  Octopus:
    type: application
    platform: iOS
    # ⚠️ Info.plist KASITLI OLARAK sources dışında (App/ kökünde).
    # Bir klasör hem `sources` içinde olup hem plist olarak gösterilirse
    # Xcode dosyayı iki kez üretmeye çalışır:
    #   error: Multiple commands produce '.../Octopus.app/Info.plist'
    # Assets.xcassets eklenince buraya `App/Resources` girişi geri gelecek.
    sources:
      - path: App/Sources
      - path: App/Resources
        buildPhase: resources
    #
    # ⚠️ `info:` KULLANILMIYOR — KASITLI.
    # XcodeGen'in `info` bölümü mevcut dosyayı OKUMAZ; plist'i kendisi
    # üretip verilen yola YAZAR. Elle yazılmış App/Info.plist her
    # `xcodegen generate` çağrısında varsayılanlarla eziliyordu; sonuçta
    # UILaunchScreen pakete hiç girmedi ve uygulama 320x480 mantıksal
    # boyutta (iPhone 4 gibi) çalıştı.
    # INFOPLIST_FILE doğrudan verilerek dosyanın kendisi kullanılıyor.
    settings:
      base:
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.octopus.iptv
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_BITCODE: NO
    dependencies:
      # Composition root her modülü görebilen TEK yerdir.
      - package: OctopusCore
        product: OctopusCore
      - package: OctopusDomain
        product: OctopusDomain
      - package: OctopusData
        product: OctopusData
      - package: OctopusNavigation
        product: OctopusNavigation
      - package: OctopusDesignSystem
        product: OctopusDesignSystem
      - package: OctopusPlayback
        product: OctopusPlayback
      - package: OctopusPlaybackVLC
        product: OctopusPlaybackVLC
      - package: OctopusFeatures
        product: FeatureOnboarding
      - package: OctopusFeatures
        product: FeatureHome
      - package: OctopusFeatures
        product: FeatureLive
      - package: OctopusFeatures
        product: FeatureVOD
      - package: OctopusFeatures
        product: FeatureSeries
      - package: OctopusFeatures
        product: FeatureSearch
      - package: OctopusFeatures
        product: FeatureFavorites
      - package: OctopusFeatures
        product: FeaturePlayer
      - package: OctopusFeatures
        product: FeatureSettings

  OctopusTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Octopus

schemes:
  Octopus:
    build:
      targets:
        Octopus: all
    run:
      config: Debug
      # Xcode'da "Edit Scheme → Run → Arguments" altında **işaretlenebilir
      # kutular** olarak görünür; varsayılan kapalı.
      #
      # ⚠️ Elle yazmaya gerek kalmasın diye buraya kondu: argümanları o
      # listeye elle eklerken boşluklu bir satır (`-startup.player live:...`)
      # Xcode tarafından **tek argüman** sayılıyor ve sessizce hiçbir şey
      # olmuyor. Buradaki her giriş tek parça.
      commandLineArguments:
        # Sahte katalog yazar — gerçek bir IPTV kaynağı olmadan tüm
        # ekranlar dolu görünür.
        "-seedDemoData": false
        # Açılışta doğrudan oynatıcıyı açar (demo kaynağın ilk kanalı,
        # Apple'ın açık HLS örneğine bakar). `-seedDemoData` ile birlikte
        # işaretlenmeli.
        "-demoPlayer": false
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - OctopusTests
    archive:
      config: Release
